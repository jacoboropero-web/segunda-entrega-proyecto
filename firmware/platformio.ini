; Estación de Monitoreo Ambiental - firmware preliminar (Fase 2)
[env:esp32]
platform = espressif32
board = esp32dev            ; ESP32-WROOM-32E-N4 (4 MB flash)
framework = arduino
monitor_speed = 115200
upload_speed = 921600       ; CH340C con reset automático DTR/RTS
board_build.f_cpu = 80000000L   ; 80 MHz: menor consumo, suficiente para la aplicación
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
build_flags = -Wall

; Pruebas de la lógica de control en el PC (sin hardware): pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=c++17
